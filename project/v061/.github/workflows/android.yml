name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build requirements
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Configure private release signing (optional)
        env:
          KEYSTORE_B64: ${{ secrets.VOICEDOCK_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.VOICEDOCK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VOICEDOCK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VOICEDOCK_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No release signing secret configured; release artifact will be unsigned."
            exit 0
          fi
          key_path="$RUNNER_TEMP/voicedock-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          {
            echo "VOICEDOCK_KEYSTORE=$key_path"
            echo "VOICEDOCK_STORE_PASSWORD=$STORE_PASSWORD"
            echo "VOICEDOCK_KEY_ALIAS=$KEY_ALIAS"
            echo "VOICEDOCK_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Verify source formatting and patches
        run: git diff --check
      - name: Run JVM/Robolectric tests and build APKs
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - name: Package R8 mapping
        if: always()
        run: |
          mapping='app/build/outputs/mapping/release/mapping.txt'
          if [ -f "$mapping" ]; then
            mkdir -p artifacts
            zip -j artifacts/VoiceDock-AI-r8-mapping.zip "$mapping"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voicedock-android-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            artifacts/VoiceDock-AI-r8-mapping.zip
          if-no-files-found: warn
          retention-days: 30
